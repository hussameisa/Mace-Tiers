name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
        working-directory: MaceTiers-source/MaceTiers
      - uses: actions/upload-artifact@v4
        with:
          name: MaceTiers
          path: MaceTiers-source/MaceTiers/target/MaceTiers.jar
